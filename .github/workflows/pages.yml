# Déploiement automatique de l'application sur GitHub Pages à chaque push sur master.
# L'application reste un fichier .html autonome (C8) ; Pages ne sert qu'à la diffuser.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Aucun droit par défaut : chaque job reçoit les siens. Le job `build` exécute le
# code des dépendances npm, il ne doit donc pas avoir le droit de publier.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Les actions sont épinglées par empreinte de commit : une étiquette comme `v4`
# peut être déplacée vers un autre code, une empreinte non.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Versions exactes de package-lock.json, empreintes vérifiées ; `.npmrc`
      # interdit les scripts d'installation.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
